services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban_board
    ports:
      - '5433:5432'
    volumes:
      - kanban_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kanban -d kanban_board']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  kanban_pgdata:
